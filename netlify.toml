[build]
  publish = "."
  command = ""

# Netlify puede reescribir /archivo.html como /archivo. El archivo de
# verificacion de Google Search Console debe servirse en su ruta literal,
# asi que se desactiva ese comportamiento.
[build.processing.html]
  pretty_urls = false

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"

# Dominio adicional byld.mx (y www.byld.mx): redirige todo a byld.com.mx
# con 301, para que Google vea un solo sitio y no contenido duplicado.
# No hace nada hasta que byld.mx se agregue como alias en Netlify.
[[redirects]]
  from = "https://byld.mx/*"
  to = "https://byld.com.mx/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.byld.mx/*"
  to = "https://byld.com.mx/:splat"
  status = 301
  force = true
