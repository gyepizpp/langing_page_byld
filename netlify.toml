[build]
  publish = "."
  command = ""

# Netlify puede reescribir /archivo.html como /archivo. El archivo de
# verificacion de Google Search Console debe servirse en su ruta literal,
# asi que se desactiva ese comportamiento.
[build.processing.html]
  pretty_urls = false

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"

# Las tres paginas de servicio se consolidaron en la home a peticion del
# cliente. Redireccion permanente para que Google transfiera las senales
# a la pagina principal en vez de leerlo como error.
[[redirects]]
  from = "/software-a-la-medida/*"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/implementacion-de-ia/*"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/inteligencia-de-negocio/*"
  to = "/"
  status = 301
  force = true
